[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-vcell-fvsolver"
version = "0.1.0"
description = "process-bigraph wrapper around pyvcell / pyvcell-fvsolver for 3D reaction-diffusion simulations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Eran Agmon"}]
dependencies = [
    "process-bigraph>=0.0.30",
    "bigraph-schema>=0.0.60",
    "viva-superpowers",
    "numpy>=1.26",
    "pyvcell>=0.5",
    "h5py",
    "pyvista",
    "pyvcell-fvsolver>=0.1",
    "libvcell",
    "antimony",
    "python-libsbml",
    "pyyaml",
    "bigraph-viz>=2.0.3",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
cli = ["typer", "rich"]
dev = ["pytest>=8"]
demo = [
    "bigraph-viz>=0.0.40",
    "matplotlib>=3.8",
]
test = [
    "pytest>=8",
]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_vcell_fvsolver*"]

[tool.setuptools.package-data]
pbg_vcell_fvsolver = ["composites/*.yaml", "composites/*.composite.yaml"]

[project.scripts]
viva-vcell-fvsolver = "pbg_vcell_fvsolver.cli.__main__:main"
